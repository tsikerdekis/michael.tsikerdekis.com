  bio         : "Michael Tsikerdekis is an associate professor in the Computer Science Department at Western Washington University. Working across computer science, business information systems, and the information sciences, his research interests include cybersecurity, AI/ML, deception, data mining, and social computing. Tsikerdekis has a PhD in Informatics from Masaryk University. He is a senior member of the Institute of Electrical and Electronics Engineers and a 24/25 U.S. Fulbright Scholar."
